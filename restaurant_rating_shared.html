<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant Rating Calculator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    color: #222;
    padding: 30px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}


/* =========================
   CONTROL PANEL
========================= */

.controls {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.controls-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.controls-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

input {
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

#personName {
    flex: 1;
    min-width: 220px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.add-person {
    background: #222;
    color: white;
}

.add-person:hover {
    background: #444;
}


/* =========================
   DATA BUTTONS
========================= */

.data-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.save-btn {
    background: #28a745;
    color: white;
}

.save-btn:hover {
    background: #218838;
}

.export-btn {
    background: #007bff;
    color: white;
}

.export-btn:hover {
    background: #0069d9;
}

.import-btn {
    background: #6f42c1;
    color: white;
}

.import-btn:hover {
    background: #59339d;
}

.clear-btn {
    background: #dc3545;
    color: white;
}

.clear-btn:hover {
    background: #c82333;
}

.save-status {
    margin-top: 12px;
    color: #777;
    font-size: 13px;
}


/* =========================
   TABLE
========================= */

.table-container {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

th {
    background: #222;
    color: white;
    padding: 15px;
    text-align: center;
    white-space: nowrap;
}

th:first-child {
    text-align: left;
}

td {
    padding: 14px;
    border-bottom: 1px solid #eee;
    text-align: center;
}

td:first-child {
    text-align: left;
    font-weight: bold;
}

tr:last-child td {
    border-bottom: none;
}


/* =========================
   INPUTS
========================= */

.restaurant-input {
    width: 100%;
    min-width: 160px;
}

.rating-input {
    width: 70px;
    text-align: center;
    font-size: 16px;
}

.rating-input:focus,
.restaurant-input:focus {
    border-color: #ffb400;
    outline: none;
}


/* =========================
   AVERAGE
========================= */

.average {
    font-size: 18px;
    font-weight: bold;
    white-space: nowrap;
}

.average-stars {
    color: #ffb400;
    letter-spacing: 1px;
}

.average-number {
    color: #555;
    margin-left: 5px;
}


/* =========================
   DELETE
========================= */

.delete-btn {
    background: #ffe5e5;
    color: #d33;
    padding: 8px 12px;
}

.delete-btn:hover {
    background: #ffd0d0;
}


/* =========================
   ADD RESTAURANT
========================= */

.add-restaurant {
    margin-top: 20px;
    background: #ffb400;
    color: #222;
}

.add-restaurant:hover {
    background: #e5a000;
}


/* =========================
   EMPTY
========================= */

.empty {
    padding: 40px;
    text-align: center;
    color: #999;
}


/* =========================
   SUMMARY
========================= */

.summary {
    margin-top: 20px;
    background: white;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.summary-number {
    font-size: 30px;
    font-weight: bold;
}

.summary-stars {
    color: #ffb400;
    font-size: 25px;
    margin-top: 5px;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    h1 {
        font-size: 25px;
    }

    .controls-row {
        flex-direction: column;
    }

    #personName {
        width: 100%;
    }

    .add-person {
        width: 100%;
    }

    .data-buttons {
        flex-direction: column;
    }

    .data-buttons button {
        width: 100%;
    }

}

</style>
</head>


<body>

<div class="container">

    <h1>Baber and Tawisha Foodtrips Rating</h1>

    <div class="subtitle">
        Rate 1 to 5 stars
    </div>


    <!-- =========================
         ADD RATING PERSON
    ========================== -->

    <div class="controls">

        <div class="controls-title">
            Add Rating Person
        </div>

        <div class="controls-row">

            <input
                type="text"
                id="personName"
                placeholder="Example: Beaver"
            >

            <button
                class="add-person"
                onclick="addPerson()"
            >
                + Add Rating Person
            </button>

        </div>


        <!-- DATA BUTTONS -->

        <div class="data-buttons">

            <button
                class="save-btn"
                onclick="saveData()"
            >
                💾 Save Data
            </button>

            <button
                class="export-btn"
                onclick="exportData()"
            >
                📥 Export Data
            </button>

            <button
                class="import-btn"
                onclick="document.getElementById('fileInput').click()"
            >
                📤 Import Data
            </button>

            <button
                class="clear-btn"
                onclick="clearAllData()"
            >
                🗑 Clear All Data
            </button>

        </div>


        <div
            class="save-status"
            id="saveStatus"
        >
            Data is automatically saved in this browser.
        </div>


        <!-- Hidden file input -->

        <input
            type="file"
            id="fileInput"
            accept=".json"
            style="display:none"
            onchange="importData(event)"
        >

    </div>


    <!-- =========================
         TABLE
    ========================== -->

    <div class="table-container">

        <table>

            <thead>

                <tr id="tableHeader">

                    <th>
                        Restaurant
                    </th>

                    <th>
                        Average Rate
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="tableBody">

            </tbody>

        </table>


        <div
            id="emptyMessage"
            class="empty"
        >
            Add a rating person and restaurant to get started.
        </div>

    </div>


    <!-- ADD RESTAURANT -->

    <button
        class="add-restaurant"
        onclick="addRestaurant()"
    >
        + Add Restaurant
    </button>


    <!-- =========================
         OVERALL AVERAGE
    ========================== -->

    <div class="summary">

        <div>
            Overall Average
        </div>

        <div
            class="summary-number"
            id="overallAverage"
        >
            0.00
        </div>

        <div
            class="summary-stars"
            id="overallStars"
        >
            ☆☆☆☆☆
        </div>

    </div>

</div>


<script>


/* ==========================================
   DATA
========================================== */

let people = [];

let restaurants = [];


/* ==========================================
   SUPABASE CLOUD STORAGE
   ==========================================

   IMPORTANT:
   Replace the two values below with:
   - Supabase Project URL
   - Supabase anon/public key

   NEVER put a Supabase service_role key in this HTML.
*/

const SUPABASE_URL = "https://rnfnrhteiurdongavmzk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuZm5yaHRlaXVyZG9uZ2F2bXprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDYzMDMsImV4cCI6MjEwNDE4MjMwM30.5vKV45yG8cobQ1wLd0fhKsXOd4ymEye70cwW2lYQl8c";

const CLOUD_TABLE = "rating_data";

function supabaseHeaders(extra = {}) {
    return {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        ...extra
    };
}

async function loadData() {

    updateSaveStatus("☁ Loading shared data...");

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/${CLOUD_TABLE}?id=eq.1&select=data`,
            {
                method: "GET",
                headers: supabaseHeaders()
            }
        );

        if (!response.ok) {
            throw new Error(
                `Cloud load failed (${response.status})`
            );
        }

        const rows = await response.json();

        if (rows.length > 0 && rows[0].data) {

            const data = rows[0].data;

            people = Array.isArray(data.people)
                ? data.people
                : [];

            restaurants = Array.isArray(data.restaurants)
                ? data.restaurants
                : [];

            render();

            updateSaveStatus(
                "✓ Shared data loaded from cloud."
            );

            return;
        }

        /*
         * First-time setup:
         * If this browser already has old local data,
         * offer it to the shared database automatically.
         */
        const oldSavedData =
            localStorage.getItem("restaurantRatingData");

        if (oldSavedData) {

            try {

                const oldData =
                    JSON.parse(oldSavedData);

                people =
                    Array.isArray(oldData.people)
                        ? oldData.people
                        : [];

                restaurants =
                    Array.isArray(oldData.restaurants)
                        ? oldData.restaurants
                        : [];

                await saveData();

                render();

                updateSaveStatus(
                    "✓ Old browser data moved to shared cloud storage."
                );

                return;

            } catch (error) {
                console.error(error);
            }
        }

        people = [];
        restaurants = [];

        render();

        updateSaveStatus(
            "✓ Shared database is ready."
        );

    } catch (error) {

        console.error(error);

        /*
         * Keep the page usable if the cloud cannot be reached.
         * Existing browser data can still be displayed.
         */
        const savedData =
            localStorage.getItem("restaurantRatingData");

        if (savedData) {

            try {

                const data =
                    JSON.parse(savedData);

                people = data.people || [];
                restaurants = data.restaurants || [];

                render();

                updateSaveStatus(
                    "⚠ Cloud unavailable. Showing this browser's saved data."
                );

            } catch (localError) {

                console.error(localError);

                updateSaveStatus(
                    "⚠ Unable to load data."
                );
            }

        } else {

            updateSaveStatus(
                "⚠ Unable to connect to the shared database."
            );
        }
    }
}


/* ==========================================
   SAVE DATA TO SUPABASE
   ========================================== */

async function saveData() {

    const data = {
        people: people,
        restaurants: restaurants
    };

    /*
     * Keep a local backup too.
     */
    localStorage.setItem(
        "restaurantRatingData",
        JSON.stringify(data)
    );

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/${CLOUD_TABLE}`,
            {
                method: "POST",
                headers: supabaseHeaders({
                    "Prefer":
                        "resolution=merge-duplicates,return=minimal"
                }),
                body: JSON.stringify({
                    id: 1,
                    data: data,
                    updated_at: new Date().toISOString()
                })
            }
        );

        if (!response.ok) {
            const message = await response.text();
            throw new Error(
                `Cloud save failed (${response.status}): ${message}`
            );
        }

        updateSaveStatus(
            "✓ Data saved and shared with everyone."
        );

        return true;

    } catch (error) {

        console.error(error);

        updateSaveStatus(
            "⚠ Saved on this browser, but cloud save failed."
        );

        return false;
    }
}


/* ==========================================
   AUTO SAVE
   ========================================== */

let saveTimer = null;
let saveInProgress = false;
let saveAgain = false;

function autoSave() {

    const data = {
        people: people,
        restaurants: restaurants
    };

    /*
     * Always keep the browser backup.
     */
    localStorage.setItem(
        "restaurantRatingData",
        JSON.stringify(data)
    );

    clearTimeout(saveTimer);

    saveTimer = setTimeout(
        () => saveToCloud(),
        350
    );

    updateSaveStatus(
        "☁ Saving shared data..."
    );
}

async function saveToCloud() {

    if (saveInProgress) {
        saveAgain = true;
        return;
    }

    saveInProgress = true;

    const data = {
        people: people,
        restaurants: restaurants
    };

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/${CLOUD_TABLE}`,
            {
                method: "POST",
                headers: supabaseHeaders({
                    "Prefer":
                        "resolution=merge-duplicates,return=minimal"
                }),
                body: JSON.stringify({
                    id: 1,
                    data: data,
                    updated_at: new Date().toISOString()
                })
            }
        );

        if (!response.ok) {
            const message = await response.text();
            throw new Error(
                `Cloud save failed (${response.status}): ${message}`
            );
        }

        updateSaveStatus(
            "✓ Automatically saved and shared."
        );

    } catch (error) {

        console.error(error);

        updateSaveStatus(
            "⚠ Cloud save failed. Browser backup kept."
        );

    } finally {

        saveInProgress = false;

        if (saveAgain) {

            saveAgain = false;

            setTimeout(
                () => saveToCloud(),
                100
            );
        }
    }
}


/* ==========================================
   SAVE STATUS
   ========================================== */

function updateSaveStatus(message) {

    document.getElementById(
        "saveStatus"
    ).textContent = message;

}

/* ==========================================
   ADD PERSON
========================================== */

function addPerson() {

    const input =
        document.getElementById("personName");

    const name =
        input.value.trim();


    if (!name) {

        alert(
            "Please enter a rating person's name."
        );

        return;
    }


    /*
       Prevent duplicate names
    */

    if (
        people.some(
            person =>
                person.toLowerCase() ===
                name.toLowerCase()
        )
    ) {

        alert(
            "This rating person already exists."
        );

        return;
    }


    people.push(name);


    /*
       Add an empty rating
       to every restaurant
    */

    restaurants.forEach(
        restaurant => {

            restaurant.ratings.push("");

        }
    );


    input.value = "";


    autoSave();

    render();

}


/* ==========================================
   ADD RESTAURANT
========================================== */

function addRestaurant() {

    if (people.length === 0) {

        alert(
            "Please add at least one rating person first."
        );

        return;
    }


    const restaurant = {

        name: "New Restaurant",

        ratings:
            people.map(() => "")

    };


    restaurants.push(
        restaurant
    );


    autoSave();

    render();

}


/* ==========================================
   DELETE RESTAURANT
========================================== */

function deleteRestaurant(index) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this restaurant?"
        );


    if (!confirmed) {
        return;
    }


    restaurants.splice(
        index,
        1
    );


    autoSave();

    render();

}


/* ==========================================
   UPDATE RESTAURANT NAME
========================================== */

function updateRestaurantName(
    index,
    value
) {

    restaurants[index].name =
        value;

    autoSave();

}


/* ==========================================
   UPDATE RATING
========================================== */

function updateRating(
    restaurantIndex,
    personIndex,
    value
) {


    /*
       Allow empty input
    */

    if (value === "") {

        restaurants[
            restaurantIndex
        ].ratings[
            personIndex
        ] = "";

        autoSave();

        calculateAverage();

        return;
    }


    let number =
        Number(value);


    /*
       Keep rating between 1 and 5
    */

    if (number < 1) {
        number = 1;
    }

    if (number > 5) {
        number = 5;
    }


    restaurants[
        restaurantIndex
    ].ratings[
        personIndex
    ] = number;


    autoSave();

    calculateAverage();

}


/* ==========================================
   GET AVERAGE
========================================== */

function getAverage(ratings) {

    const validRatings =
        ratings

        .filter(
            rating =>
                rating !== "" &&
                !isNaN(Number(rating))
        )

        .map(Number);


    if (
        validRatings.length === 0
    ) {

        return null;

    }


    const total =
        validRatings.reduce(
            (sum, rating) =>
                sum + rating,
            0
        );


    return (
        total /
        validRatings.length
    );

}


/* ==========================================
   CREATE STARS
========================================== */

function createStars(average) {

    if (average === null) {

        return "☆☆☆☆☆";

    }


    let stars = "";


    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        if (average >= i) {

            stars += "★";

        } else {

            stars += "☆";

        }

    }


    return stars;

}


/* ==========================================
   RENDER TABLE
========================================== */

function render() {

    const header =
        document.getElementById(
            "tableHeader"
        );

    const body =
        document.getElementById(
            "tableBody"
        );

    const emptyMessage =
        document.getElementById(
            "emptyMessage"
        );


    /*
       TABLE HEADER
    */

    header.innerHTML = `

        <th>
            Restaurant
        </th>

        ${people.map(
            person => `

                <th>
                    ${escapeHTML(person)}'s Rating
                </th>

            `
        ).join("")}

        <th>
            Average Rate
        </th>

        <th>
            Action
        </th>

    `;


    /*
       EMPTY STATE
    */

    if (
        restaurants.length === 0
    ) {

        body.innerHTML = "";

        emptyMessage.style.display =
            "block";

        calculateAverage();

        return;

    }


    emptyMessage.style.display =
        "none";


    /*
       CREATE ROWS
    */

    body.innerHTML =
        restaurants.map(
            (
                restaurant,
                restaurantIndex
            ) => {


                const average =
                    getAverage(
                        restaurant.ratings
                    );


                return `

                    <tr>

                        <!-- RESTAURANT -->

                        <td>

                            <input
                                class="restaurant-input"
                                value="${escapeHTML(
                                    restaurant.name
                                )}"
                                onchange="
                                    updateRestaurantName(
                                        ${restaurantIndex},
                                        this.value
                                    )
                                "
                            >

                        </td>


                        <!-- PERSON RATINGS -->

                        ${people.map(
                            (
                                person,
                                personIndex
                            ) => `

                                <td>

                                    <input
                                        class="rating-input"
                                        type="number"
                                        min="1"
                                        max="5"
                                        step="1"
                                        placeholder="1-5"
                                        value="${
                                            restaurant.ratings[
                                                personIndex
                                            ]
                                        }"

                                        oninput="
                                            updateRating(
                                                ${restaurantIndex},
                                                ${personIndex},
                                                this.value
                                            )
                                        "
                                    >

                                </td>

                            `
                        ).join("")}


                        <!-- AVERAGE -->

                        <td>

                            <div class="average">

                                <span class="average-stars">

                                    ${createStars(
                                        average
                                    )}

                                </span>

                                <span class="average-number">

                                    ${
                                        average === null
                                            ? "-"
                                            : average.toFixed(2)
                                    }

                                </span>

                            </div>

                        </td>


                        <!-- DELETE -->

                        <td>

                            <button
                                class="delete-btn"
                                onclick="
                                    deleteRestaurant(
                                        ${restaurantIndex}
                                    )
                                "
                            >
                                Delete
                            </button>

                        </td>

                    </tr>

                `;

            }
        ).join("");


    calculateAverage();

}


/* ==========================================
   OVERALL AVERAGE
========================================== */

function calculateAverage() {

    const allRatings = [];


    restaurants.forEach(
        restaurant => {

            restaurant.ratings.forEach(
                rating => {

                    if (
                        rating !== "" &&
                        !isNaN(Number(rating))
                    ) {

                        allRatings.push(
                            Number(rating)
                        );

                    }

                }
            );

        }
    );


    const averageElement =
        document.getElementById(
            "overallAverage"
        );

    const starsElement =
        document.getElementById(
            "overallStars"
        );


    if (
        allRatings.length === 0
    ) {

        averageElement.textContent =
            "0.00";

        starsElement.textContent =
            "☆☆☆☆☆";

        return;

    }


    const total =
        allRatings.reduce(
            (sum, rating) =>
                sum + rating,
            0
        );


    const average =
        total /
        allRatings.length;


    averageElement.textContent =
        average.toFixed(2);


    starsElement.textContent =
        createStars(average);

}


/* ==========================================
   EXPORT DATA
========================================== */

function exportData() {

    const data = {

        people: people,

        restaurants: restaurants,

        exportedAt:
            new Date().toISOString()

    };


    const json =
        JSON.stringify(
            data,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        "restaurant-ratings.json";


    link.click();


    URL.revokeObjectURL(
        url
    );


    updateSaveStatus(
        "✓ Data exported successfully."
    );

}


/* ==========================================
   IMPORT DATA
========================================== */

function importData(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !data.people ||
                    !data.restaurants
                ) {

                    throw new Error(
                        "Invalid data"
                    );

                }


                people =
                    data.people;


                restaurants =
                    data.restaurants;


                saveData();

                render();


                updateSaveStatus(
                    "✓ Data imported successfully."
                );


            } catch (error) {

                alert(
                    "The selected file is not valid."
                );

            }

        };


    reader.readAsText(
        file
    );


    /*
       Reset file input so
       the same file can be
       imported again.
    */

    event.target.value = "";

}


/* ==========================================
   CLEAR ALL DATA
   ========================================== */

async function clearAllData() {

    const confirmed =
        confirm(
            "WARNING!\n\nThis will delete all restaurants, ratings, and rating people for EVERYONE using this shared page.\n\nContinue?"
        );

    if (!confirmed) {
        return;
    }

    people = [];
    restaurants = [];

    localStorage.removeItem(
        "restaurantRatingData"
    );

    render();

    await saveData();

    updateSaveStatus(
        "✓ Shared data has been cleared for everyone."
    );
}


/* ==========================================
   REFRESH SHARED DATA
   ========================================== */

async function refreshCloudData() {

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/${CLOUD_TABLE}?id=eq.1&select=data`,
            {
                method: "GET",
                headers: supabaseHeaders()
            }
        );

        if (!response.ok) {
            throw new Error(
                `Refresh failed (${response.status})`
            );
        }

        const rows = await response.json();

        if (rows.length > 0 && rows[0].data) {

            people =
                Array.isArray(rows[0].data.people)
                    ? rows[0].data.people
                    : [];

            restaurants =
                Array.isArray(rows[0].data.restaurants)
                    ? rows[0].data.restaurants
                    : [];

            render();

            updateSaveStatus(
                "✓ Latest shared data loaded."
            );
        }

    } catch (error) {

        console.error(error);

        updateSaveStatus(
            "⚠ Could not refresh shared data."
        );
    }
}

/* ==========================================
   SECURITY
========================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
